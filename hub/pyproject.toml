[project]
name = "axiom-vision-hub"
version = "0.2.0"
description = "Axiom Vision fleet hub: one webpage for every site; sites dial out, nothing is port-forwarded."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.32",   # forwarded_allow_ips with CIDR ranges
  "websockets>=13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "email-validator>=2",
  "pywebpush>=2",
  "py-vapid>=1.9",
  "cryptography>=42",
  "tzdata",            # zoneinfo's IANA database on hosts without one (Windows, slim images): SOC arming windows
  "timezonefinder>=6.5",   # a Site's time zone from its coordinates, offline (geocode.tz_for)
  "tunnelproto",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
