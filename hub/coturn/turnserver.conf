# coturn for the Axiom Vision hub. Credentials are minted by the hub (hub/hub/turn.py) with the same static secret.
# Open at the hub: 3478/udp+tcp (TURN), 49152-49252/udp (relay). Nothing at sites. (TURN over TLS on 5349 needs a
# certificate wired into coturn; not enabled yet, and the hub does not advertise it.)
listening-port=3478
min-port=49152
max-port=49252
fingerprint
lt-cred-mech
use-auth-secret
# static-auth-secret and realm come from docker-compose.yml (HUB_TURN_SECRET, HUB_DOMAIN)
no-cli
no-multicast-peers
# relay only to the public internet: a site's LAN, the hub host itself (coturn runs with network_mode: host, so
# Postgres, the hub and the Docker networks are local to it) and the cloud metadata address can't be reached
# through the relay. Ranges are inclusive; IPv6 ranges in the same "first-last" form.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# No "::-::1" or IPv4-mapped "::ffff:0.0.0.0-::ffff:255.255.255.255" here: coturn matches IPv4 peers against them,
# which denied every peer and broke all relayed video ("peer IP 178.156.211.145 denied in the range ::-::1").
# The IPv4 ranges above already cover what the mapped range meant; IPv6 loopback is never a relay peer.
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
stale-nonce=600
total-quota=200
user-quota=32
log-file=stdout
