# coturn for the Axiom Vision hub. Credentials are minted by the hub (hub/hub/turn.py) with the same static secret.
# Open at the hub: 3478/udp+tcp (TURN), 49152-49252/udp (relay). Nothing at sites. (TURN over TLS on 5349 needs a
# certificate wired into coturn; not enabled yet, and the hub does not advertise it.)
listening-port=3478
min-port=49152
max-port=49252
fingerprint
lt-cred-mech
use-auth-secret
# static-auth-secret and realm come from docker-compose.yml (HUB_TURN_SECRET, HUB_DOMAIN)
no-cli
no-multicast-peers
# relay only to the public internet: a site's LAN can't be reached through the hub's relay
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
stale-nonce=600
total-quota=200
user-quota=32
log-file=stdout
