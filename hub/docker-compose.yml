# Production hub: Caddy (80/443, Let's Encrypt) -> hub -> Postgres, plus coturn. Only the hub opens ports; sites open nothing.
#   cp hub/.env.example hub/.env   (set HUB_DOMAIN, HUB_PUBLIC_URL, HUB_SECRET, POSTGRES_PASSWORD, HUB_TURN_SECRET, HUB_VLLM_SITE)
#   docker compose -f hub/docker-compose.yml up -d --build
#   docker compose -f hub/docker-compose.yml exec hub python -m hub createsuper you@example.com
# Update: git pull && docker compose -f hub/docker-compose.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-hub.axiomvision.ai}
    depends_on: [hub]

  hub:
    build: { context: .., dockerfile: hub/Dockerfile }
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}                       # digest (07:30) and backups (03:00) run in this zone
      HUB_DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:-change-me}@postgres:5432/hub
      HUB_SECRET: ${HUB_SECRET:?set HUB_SECRET in hub/.env}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-https://hub.axiomvision.ai}
      HUB_COOKIE_SECURE: "1"
      HUB_TURN_HOST: ${HUB_DOMAIN:-hub.axiomvision.ai}
      HUB_TURN_SECRET: ${HUB_TURN_SECRET:-}
      # Shared AI: either a site whose local Qwen serves the fleet through its tunnel (no GPU on the hub) ...
      HUB_VLLM_SITE: ${HUB_VLLM_SITE:-}
      # ... or a vLLM/Ollama the hub reaches directly (the `ai` profile below, or any OpenAI-compatible URL).
      HUB_VLLM_URL: ${HUB_VLLM_URL:-}
      HUB_VLLM_KEY: ${HUB_VLLM_KEY:-}
      HUB_VLLM_MODEL: ${HUB_VLLM_MODEL:-}
      # Site addresses and maps (empty = OpenStreetMap Nominatim and OSM tiles)
      HUB_GEOCODER_URL: ${HUB_GEOCODER_URL:-}
      HUB_GEOCODER_KEY: ${HUB_GEOCODER_KEY:-}
      HUB_CENSUS_URL: ${HUB_CENSUS_URL:-}
      HUB_GEOCODER_COUNTRY: ${HUB_GEOCODER_COUNTRY:-US}
      HUB_MAP_TILES: ${HUB_MAP_TILES:-}
      HUB_MAP_ATTRIBUTION: ${HUB_MAP_ATTRIBUTION:-}
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8000"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TURN relay so live video reaches browsers outside the sites' LANs. Open 3478/udp+tcp and 49152-49252/udp.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    volumes: ["./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"]
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${HUB_TURN_SECRET:?set HUB_TURN_SECRET in hub/.env}", "--realm=${HUB_DOMAIN:-hub.axiomvision.ai}"]

  # Shared AI on the hub's own GPU (optional: docker compose --profile ai up), e.g. Qwen2.5-VL-32B. Set
  # HUB_VLLM_URL=http://vllm:8000/v1 and HUB_VLLM_KEY to match.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["ai"]
    restart: unless-stopped
    command: ["--model", "${HUB_VLLM_MODEL:-Qwen/Qwen2.5-VL-32B-Instruct-AWQ}", "--quantization", "awq", "--max-model-len", "8192",
              "--api-key", "${HUB_VLLM_KEY:-internal}", "--limit-mm-per-prompt", "image=6", "--gpu-memory-utilization", "0.92"]
    volumes: ["hf_cache:/root/.cache/huggingface"]
    expose: ["8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  hf_cache:
  caddy_data:
  caddy_config:
  pg_data:
